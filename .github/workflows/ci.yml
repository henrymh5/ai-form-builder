name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: "10"
  NODE_VERSION: "22"

jobs:
  static-checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Integration/RLS + E2E tests run against a local Supabase stack.
  # Added once Phase 3 (Auth & Workspaces) introduces the first migrations —
  # see plan §15 "CI (GitHub Actions): ... zweiter Job".
